name: Deploy Classic Games Web

on:
  push:
    branches: [main]
    paths:
      - 'games-web/**'
      - '.github/workflows/deploy-games.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble and validate browser assets
        run: |
          cat games-web/build/app.*.part > games-web/app.js
          node --check games-web/app.js
          rm -rf games-web/build

      - name: Create Pages project (idempotent)
        run: npx wrangler pages project create classic-games-web --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish browser games
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy games-web --project-name=classic-games-web --branch=main
          packageManager: npm

      - name: Attach games.basilan.us custom domain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/classic-games-web/domains"
          EXISTING="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${API}")"
          if echo "${EXISTING}" | jq -e '.result[]? | select(.name == "games.basilan.us")' >/dev/null; then
            echo "games.basilan.us is already attached."
          else
            curl -fsS -X POST "${API}" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data '{"name":"games.basilan.us"}' | jq .
          fi
