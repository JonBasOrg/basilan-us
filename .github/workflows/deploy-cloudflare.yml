# Deploy basilan.us to Cloudflare Pages via the Cloudflare Workers CLI.
#
# `wrangler pages deploy` auto-creates the "basilan-us" Pages project on first
# run, so no manual Cloudflare dashboard setup is needed.
#
# Secret prerequisites (repo -> Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  (Cloudflare API token, Account->Cloudflare Pages:Edit,
#                          no IP whitelist so GitHub Actions runners are allowed)
#   CLOUDFLARE_ACCOUNT_ID (your Cloudflare account id)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Create the Pages project if it does not exist, then always deploy.
          command: (pages project create basilan-us --production-branch=main || true) && pages deploy out --project-name=basilan-us --branch=main
          packageManager: npm